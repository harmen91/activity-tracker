<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Variables ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0f;
      --surface:   #141417;
      --border:    #242428;
      --accent:    #c8f542;
      --accent2:   #42f5b3;
      --muted:     #555560;
      --text:      #e8e8ef;
      --text-dim:  #888898;
      --danger:    #f54242;
      --radius:    6px;
      --mono:      'DM Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 2rem 1rem 6rem;
      background-image:
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(200,245,66,.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 20% 90%, rgba(66,245,179,.05) 0%, transparent 60%);
    }

    /* ── Layout ── */
    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
      animation: fadeDown .5s ease both;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .logo span {
      color: var(--accent);
      display: inline-block;
      transform: skewX(-6deg);
    }

    .tagline {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* ── Add Activity Form ── */
    .add-section {
      display: flex;
      gap: .75rem;
      margin-bottom: 2.5rem;
      animation: fadeDown .5s .1s ease both;
    }

    .add-section input[type="text"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 600;
      padding: .75rem 1rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .add-section input[type="text"]::placeholder { color: var(--muted); font-weight: 400; }

    .add-section input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,245,66,.12);
    }

    .btn {
      background: var(--accent);
      color: #0d0d0f;
      border: none;
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .02em;
      padding: .75rem 1.4rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, transform .1s, box-shadow .2s;
    }

    .btn:hover { background: #d8ff55; box-shadow: 0 0 20px rgba(200,245,66,.3); }
    .btn:active { transform: scale(.97); }

    /* ── Section label ── */
    .section-label {
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── Activity List ── */
    #activity-list {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    /* ── Activity Card ── */
    .activity-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 1rem;
      transition: border-color .25s, transform .2s;
      animation: slideIn .3s ease both;
      position: relative;
      overflow: hidden;
    }

    .activity-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--muted);
      border-radius: var(--radius) 0 0 var(--radius);
      transition: background .25s, height .25s;
    }

    .activity-card.running { border-color: var(--accent); }
    .activity-card.running::before { background: var(--accent); }

    .activity-card:hover { transform: translateX(3px); }

    /* Card left: name + stats */
    .card-info { min-width: 0; }

    .activity-name {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: .3rem;
    }

    .activity-stats {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .stat {
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--text-dim);
    }

    .stat strong {
      color: var(--text);
      font-weight: 500;
    }

    .stat.live strong { color: var(--accent); }

    /* Card center: live timer */
    .live-timer {
      font-family: var(--mono);
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: .05em;
      color: var(--accent);
      min-width: 6.5rem;
      text-align: right;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }

    .activity-card.running .live-timer { opacity: 1; }

    /* Card right: controls */
    .card-controls { display: flex; gap: .5rem; }

    .ctrl-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 500;
      padding: .4rem .8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s, border-color .2s, background .2s;
    }

    .ctrl-btn:hover { color: var(--text); border-color: var(--text-dim); }

    .ctrl-btn.start { color: var(--accent); border-color: var(--accent); }
    .ctrl-btn.start:hover { background: rgba(200,245,66,.1); }

    .ctrl-btn.stop { color: var(--danger); border-color: var(--danger); }
    .ctrl-btn.stop:hover { background: rgba(245,66,66,.1); }

    .ctrl-btn.del:hover { color: var(--danger); border-color: var(--danger); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .85rem;
      letter-spacing: .05em;
      display: none;
    }

    #activity-list:empty + .empty { display: block; }

    /* ── Summary bar ── */
    .summary {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      animation: fadeDown .5s .2s ease both;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }

    .summary-item .s-label {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .summary-item .s-value {
      font-family: var(--mono);
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--accent2);
    }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .activity-card { grid-template-columns: 1fr; }
      .live-timer { text-align: left; font-size: 1.2rem; }
      .card-controls { justify-content: flex-start; }
      .add-section { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="logo">harmen<span>track</span></div>
    </div>
    <div class="tagline">activity timer</div>
  </header>

  <div class="add-section">
    <input type="text" id="activity-input" placeholder="Enter activity name…" maxlength="48" />
    <button class="btn" onclick="addActivity()">+ Add</button>
  </div>

  <p class="section-label">Activities</p>
  <div id="activity-list"></div>
  <div class="empty">No activities yet — add one above.</div>

  <div class="summary">
    <div class="summary-item">
      <span class="s-label">Total tracked</span>
      <span class="s-value" id="summary-total">00:00:00</span>
    </div>
    <div class="summary-item">
      <span class="s-label">Activities</span>
      <span class="s-value" id="summary-count">0</span>
    </div>
    <div class="summary-item">
      <span class="s-label">Sessions</span>
      <span class="s-value" id="summary-sessions">0</span>
    </div>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────
  const activities = [];       // { id, name, total, sessions, startedAt, intervalId }
  let activeId = null;

  const STORAGE_KEY = 'timetrack_activities';

  // ── localStorage ───────────────────────────────────────
  function saveToStorage() {
    // Don't persist intervalId or live startedAt — stop any running timer before saving
    const data = activities.map(({ id, name, total, sessions }) => ({ id, name, total, sessions }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      for (const item of saved) {
        activities.push({ ...item, startedAt: null, intervalId: null });
        renderCard(activities[activities.length - 1]);
      }
      updateSummary();
    } catch (e) {
      console.warn('Could not load saved activities:', e);
    }
  }

  // ── DOM helpers ────────────────────────────────────────
  const list       = document.getElementById('activity-list');
  const input      = document.getElementById('activity-input');
  const sumTotal   = document.getElementById('summary-total');
  const sumCount   = document.getElementById('summary-count');
  const sumSess    = document.getElementById('summary-sessions');

  function fmt(secs) {
    const h = String(Math.floor(secs / 3600)).padStart(2,'0');
    const m = String(Math.floor((secs % 3600) / 60)).padStart(2,'0');
    const s = String(secs % 60).padStart(2,'0');
    return `${h}:${m}:${s}`;
  }

  // ── Add ────────────────────────────────────────────────
  function addActivity() {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }

    const id = Date.now();
    activities.push({ id, name, total: 0, sessions: 0, startedAt: null, intervalId: null });
    input.value = '';
    renderCard(activities[activities.length - 1]);
    updateSummary();
    saveToStorage();
    input.focus();
  }

  input.addEventListener('keydown', e => { if (e.key === 'Enter') addActivity(); });

  // ── Render one card ────────────────────────────────────
  function renderCard(act) {
    const card = document.createElement('div');
    card.className = 'activity-card';
    card.id = 'card-' + act.id;
    card.innerHTML = `
      <div class="card-info">
        <div class="activity-name">${escHtml(act.name)}</div>
        <div class="activity-stats">
          <span class="stat">Total: <strong id="total-${act.id}">${fmt(act.total)}</strong></span>
          <span class="stat">Sessions: <strong id="sess-${act.id}">${act.sessions}</strong></span>
        </div>
      </div>
      <div class="live-timer" id="live-${act.id}">00:00:00</div>
      <div class="card-controls">
        <button class="ctrl-btn start" id="btn-${act.id}" onclick="toggle(${act.id})">▶ Start</button>
        <button class="ctrl-btn del" onclick="remove(${act.id})">✕</button>
      </div>
    `;
    list.appendChild(card);
  }

  // ── Toggle start / stop ────────────────────────────────
  function toggle(id) {
    const act = activities.find(a => a.id === id);
    if (!act) return;

    if (act.startedAt !== null) {
      stop(act);
    } else {
      // Stop currently running activity first
      if (activeId !== null) {
        const running = activities.find(a => a.id === activeId);
        if (running) stop(running);
      }
      start(act);
    }
  }

  function start(act) {
    act.startedAt = Date.now();
    act.sessions += 1;
    activeId = act.id;

    document.getElementById('sess-' + act.id).textContent = act.sessions;
    document.getElementById('card-' + act.id).classList.add('running');
    document.getElementById('btn-' + act.id).textContent = '■ Stop';
    document.getElementById('btn-' + act.id).className = 'ctrl-btn stop';

    act.intervalId = setInterval(() => {
      const elapsed = Math.floor((Date.now() - act.startedAt) / 1000);
      document.getElementById('live-' + act.id).textContent = fmt(elapsed);
      updateSummary();
    }, 1000);
  }

  function stop(act) {
    const elapsed = Math.floor((Date.now() - act.startedAt) / 1000);
    act.total += elapsed;
    act.startedAt = null;
    clearInterval(act.intervalId);
    act.intervalId = null;
    if (activeId === act.id) activeId = null;

    document.getElementById('total-' + act.id).textContent = fmt(act.total);
    document.getElementById('live-' + act.id).textContent = '00:00:00';
    document.getElementById('card-' + act.id).classList.remove('running');
    document.getElementById('btn-' + act.id).textContent = '▶ Start';
    document.getElementById('btn-' + act.id).className = 'ctrl-btn start';
    updateSummary();
    saveToStorage();
  }

  // ── Remove ─────────────────────────────────────────────
  function remove(id) {
    const idx = activities.findIndex(a => a.id === id);
    if (idx === -1) return;
    const act = activities[idx];
    if (act.startedAt !== null) stop(act);
    activities.splice(idx, 1);
    document.getElementById('card-' + id)?.remove();
    updateSummary();
    saveToStorage();
  }

  // ── Summary ────────────────────────────────────────────
  function updateSummary() {
    let totalSecs = 0;
    let totalSessions = 0;
    for (const act of activities) {
      totalSecs += act.total;
      if (act.startedAt !== null) {
        totalSecs += Math.floor((Date.now() - act.startedAt) / 1000);
      }
      totalSessions += act.sessions;
    }
    sumTotal.textContent  = fmt(totalSecs);
    sumCount.textContent  = activities.length;
    sumSess.textContent   = totalSessions;
  }

  // ── Sanitise ───────────────────────────────────────────
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Boot: restore saved activities ─────────────────────
  loadFromStorage();
</script>
</body>
</html>
